spring:
  application:
    name: demo
  jackson:
    default-property-inclusion: non_null

  # Defaults target PostgreSQL. Run with --spring.profiles.active=mysql for MySQL, or
  # --spring.profiles.active=memory to start with no database at all.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/demo}
    username: ${DB_USERNAME:demo}
    password: ${DB_PASSWORD:demo}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never alter it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Resolves to db/migration/postgresql or db/migration/mysql from the JDBC URL.
    locations: classpath:db/migration/{vendor}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  auth:
    # jpa (default) or memory
    store: jpa
    jwt:
      # Development fallback only. Set APP_AUTH_JWT_SECRET (32+ chars, generated randomly)
      # in every deployed environment — rotating it invalidates all issued tokens.
      secret: ${APP_AUTH_JWT_SECRET:dev-only-secret-please-replace-me-32chars}
      issuer: demo-login
      ttl: 1h
      clock-skew: 30s
    lockout:
      enabled: true
      max-attempts: 5
      window: 15m
      lock-duration: 15m
    password-reset:
      token-ttl: 30m
    demo-user:
      enabled: true
      email: demo@example.com
      password: Password123!
      name: Demo User
    allowed-origins:
      - "http://localhost:*"
      - "https://localhost:*"

logging:
  level:
    com.proj.login: INFO
